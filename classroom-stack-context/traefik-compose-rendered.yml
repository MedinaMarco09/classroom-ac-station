name: traefik
services:
  traefik:
    container_name: traefik
    image: traefik
    networks:
      iotnetwork: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
      - mode: ingress
        target: 8080
        published: "8081"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {}
      - type: bind
        source: /opt/traefik/traefik.yml
        target: /traefik.yml
        bind: {}
      - type: bind
        source: /opt/traefik/traefik_api.yml
        target: /traefik_api.yml
        bind: {}
      - type: bind
        source: /opt/traefik/acme.json
        target: /acme.json
        bind: {}
networks:
  iotnetwork:
    name: iotnetwork
    external: true
