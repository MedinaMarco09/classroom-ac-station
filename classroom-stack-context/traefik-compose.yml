services:
  traefik:
    container_name: traefik
    restart: unless-stopped
    image: traefik
    networks:
      - iotnetwork
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml
      - ./traefik_api.yml:/traefik_api.yml
      - /opt/traefik/acme.json:/acme.json
networks:
  iotnetwork:
    external: true
